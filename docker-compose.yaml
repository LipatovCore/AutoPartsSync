version: "3.9"

services:
  web:
    build: .
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn autopartssync.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      "
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    expose:
      - 8000
    restart: always

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: always

volumes:
  static_volume:
